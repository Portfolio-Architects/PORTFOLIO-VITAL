  <!-- Toast Notification -->
  <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 border border-slate-700 hidden">
    <svg class="w-5 h-5 text-emerald-400 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>

  <!-- Emergency Contact PIN Verification Modal -->
  <div id="pin-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-2xl border-2 border-slate-300 max-w-sm w-full p-5 space-y-4">
      <div class="flex items-center gap-3 border-b border-slate-200 pb-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-100 border border-emerald-300 flex items-center justify-center shrink-0 text-xl">
          🔒
        </div>
        <div>
          <h3 class="text-base font-extrabold text-slate-900">비상연락망 보안 인증</h3>
          <p class="text-xs text-slate-500 font-medium">행사 관계자 및 근무자 확인 비밀번호 입력</p>

      <div class="space-y-2">

          <input
            id="input-contact-pin"
            type="password"
            inputmode="numeric"
            maxlength="10"
            placeholder="비밀번호 4자리 (예: 행사일)"
            onkeydown="if(event.key==='Enter') submitPinVerify();"
            class="w-full px-3.5 py-2.5 text-sm font-mono font-bold tracking-widest text-center border-2 border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200 text-slate-900"
          />
        </div>
        <div id="pin-error-msg" class="text-xs font-bold text-red-600 hidden text-center">
          ✕ 비밀번호가 올바르지 않습니다.
        </div>
      </div>

      <div class="flex items-center gap-2 pt-1">
        <button
          type="button"
          onclick="closePinModal()"
          class="flex-1 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl border border-slate-300 transition-colors cursor-pointer"
        >
          취소
        </button>
        <button
          type="button"
          onclick="submitPinVerify()"
          class="flex-1 py-2 text-xs font-extrabold bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl shadow-xs transition-colors cursor-pointer active:scale-95"
        >
          인증 및 ON
        </button>
      </div>
    </div>

  <script>
    let appData = __APP_DATA_JSON__;
    let activeTab = 'milestones';
    let activeCategory = '전체';
    let activeSchedulePhase = '전체';
    let scheduleSearchQuery = '';
    let activeDutyCategory = '전체';
    let dutySearchQuery = '';
    let expandedTasks = new Set();
    let isLargeFont = false;
    let showPrivateMobile = false;
    try {
      const savedMobile = localStorage.getItem('yangjae_festival_show_mobile');
      const isAuthed = localStorage.getItem('yangjae_contact_authed') === 'true';
      if (savedMobile === 'true' && isAuthed) {
        showPrivateMobile = true;
      }
    } catch (e) {}

    const VALID_PINS = ['1031', '0000', '7116', '2026', 'gangnam'];

    window.handleSwitchToggleClick = function() {
      if (showPrivateMobile) {
        // ON 상태에서 클릭 시 -> 즉시 OFF로 전환 (숨김)
        showPrivateMobile = false;
        try {
          localStorage.setItem('yangjae_festival_show_mobile', 'false');
        } catch (e) {}
        updateMobileToggleButtons();
        renderBooths();
        renderDuties();
      } else {
        // OFF 상태에서 ON으로 켤 때: 이미 인증된 브라우저인지 확인
        let isAuthed = false;
        try {
          isAuthed = localStorage.getItem('yangjae_contact_authed') === 'true';
        } catch (e) {}

        if (isAuthed) {
          showPrivateMobile = true;
          try {
            localStorage.setItem('yangjae_festival_show_mobile', 'true');
          } catch (e) {}
          updateMobileToggleButtons();
          renderBooths();
          renderDuties();
        } else {
          openPinModal();
        }
      }
    };

    window.openPinModal = function() {
      const modal = document.getElementById('pin-modal');
      const input = document.getElementById('input-contact-pin');
      const errMsg = document.getElementById('pin-error-msg');
      if (errMsg) errMsg.classList.add('hidden');
      if (input) {
        input.value = '';
        input.classList.remove('border-red-500');
      }
      if (modal) modal.classList.remove('hidden');
      setTimeout(() => { if (input) input.focus(); }, 50);
    };

    window.closePinModal = function() {
      const modal = document.getElementById('pin-modal');
      if (modal) modal.classList.add('hidden');
    };

    window.submitPinVerify = function() {
      const input = document.getElementById('input-contact-pin');
      const errMsg = document.getElementById('pin-error-msg');
      const entered = (input?.value || '').trim();

      if (VALID_PINS.includes(entered)) {
        try {
          localStorage.setItem('yangjae_contact_authed', 'true');
          localStorage.setItem('yangjae_festival_show_mobile', 'true');
        } catch (e) {}
        showPrivateMobile = true;
        closePinModal();
        updateMobileToggleButtons();
        renderBooths();
        renderDuties();
      } else {
        if (errMsg) errMsg.classList.remove('hidden');
        if (input) {
          input.classList.add('border-red-500');
          input.focus();
        }
      }
    };

    function updateMobileToggleButtons() {
      const isON = !!showPrivateMobile;
      const trackClassON = 'bg-emerald-500';
      const trackClassOFF = 'bg-slate-300';
      const knobClassON = 'translate-x-3.5';
      const knobClassOFF = 'translate-x-0';
      const labelText = isON ? 'ON (보임)' : 'OFF (숨김)';

    function formatAutoHyphen(str) {
      if (!str || typeof str !== 'string') return '';
      const digits = str.replace(/[^0-9]/g, '');
      if (!digits) return str;
      if (digits.startsWith('02')) {
        if (digits.length <= 2) return digits;
        if (digits.length <= 5) return digits.slice(0, 2) + '-' + digits.slice(2);
        if (digits.length <= 9) return digits.slice(0, 2) + '-' + digits.slice(2, 5) + '-' + digits.slice(5);
        return digits.slice(0, 2) + '-' + digits.slice(2, 6) + '-' + digits.slice(6, 10);
      }
      if (digits.startsWith('01') || digits.startsWith('05') || digits.startsWith('07')) {
        if (digits.length <= 3) return digits;
        if (digits.length <= 7) return digits.slice(0, 3) + '-' + digits.slice(3);
        if (digits.length <= 10) return digits.slice(0, 3) + '-' + digits.slice(3, 6) + '-' + digits.slice(6, 10);
        return digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7, 11);
      }
      return str;
    }

    function maskPersonName(raw) {
      if (!raw || typeof raw !== 'string') return '';
      const trimmed = raw.trim();
      if (!trimmed) return '';

      if (
        trimmed.includes('/') ||
        trimmed.includes('·') ||
        trimmed.includes('(주)') ||
        trimmed.endsWith('연구소') ||
        trimmed.endsWith('병원') ||
        trimmed.endsWith('의사회') ||
        trimmed.endsWith('센터') ||
        trimmed.endsWith('담당')
      ) {
        return trimmed;
      }

      const parts = trimmed.split(/\s+/);
      const first = parts[0];

      if (/(팀|과|단|소|회|원)$/.test(first) && !/^(팀장|주무관|주임|협회장|과장)/.test(parts[1] || '')) {
        return trimmed;
      }

      const hangulRegex = /^[가-힣]{2,4}$/;
      if (hangulRegex.test(first)) {
        if (parts.length > 1) {
          const second = parts[1];
          const isTitleOrParen = /^(팀장|주무관|주임|협회장|과장|국장|팀원|대표|센터장|사무관|서기관|주사|\()/.test(second);
          if (!isTitleOrParen) {
            return trimmed;
          }
        }

        let masked = first;
        if (first.length === 2) {
          masked = first[0] + 'O';
        } else if (first.length === 3) {
          masked = first[0] + 'O' + first[2];
        } else if (first.length === 4) {
          masked = first[0] + 'OO' + first[3];
        }

        if (parts.length > 1) {
          return masked + ' ' + parts.slice(1).join(' ');
        }
        return masked;
      }

      return trimmed;
    }

    function parseDetail(raw) {

      if (m) {

          status: m[1] === '완료' ? 'done' : m[1] === '진행' ? 'in-progress' : 'todo',
          date: m[2] || '',

      }
      return { date: '', status: 'todo', attendees: '', text: raw };

    function renderBulletedContent(text) {
      if (!text) return '';
      const rawLines = text.split('\n').map(l => l.trim()).filter(Boolean);
      if (rawLines.length > 1) {
        return '<div class="space-y-1">' +
          rawLines.map((line, idx) => {
            const cleanLine = line.replace(/^[-•*·]\s*/, '');
            const isHeading = idx === 0 && !line.startsWith('-') && !line.startsWith('•') && !line.startsWith('*');
            return '<div class="flex items-start gap-1.5">' +
              '<span class="text-slate-400 font-bold shrink-0 text-xs select-none mt-0.5">' + (isHeading ? '▪' : '-') + '</span>' +

            '</div>';
          }).join('') +
        '</div>';
      }

      if (text.includes(':')) {
        const colonIdx = text.indexOf(':');
        const titlePart = text.substring(0, colonIdx).trim();
        const bodyPart = text.substring(colonIdx + 1).trim();
        return '<div class="space-y-1">' +

    function parseBoothScale(scale) {
      if (!scale || typeof scale !== 'string') return { dong: 0, bus: 0 };
      const dongMatch = scale.match(/(\d+)\s*동/);
      let dong = 0;
      if (dongMatch) {
        dong = parseInt(dongMatch[1], 10);
      } else {
        const numOnly = scale.match(/^(\d+)$/);
        if (numOnly) dong = parseInt(numOnly[1], 10);
      }
      const busMatch = scale.match(/(?:검진)?버스\s*(\d+)\s*대|(\d+)\s*대\s*(?:검진)?버스|(?:검진)?버스/);
      let bus = 0;
      if (busMatch) {
        const num = busMatch[1] || busMatch[2];
        bus = num ? parseInt(num, 10) : 1;
      }
      return { dong: dong, bus: bus };
    }

        const isSports = duty.category === '체육회';
        const isSafety = duty.category === '응급안전';
        const isAgency = duty.category === '대행용역';

        const rowHover = isHQ ? 'hover:bg-blue-50/40' : (isSports ? 'hover:bg-indigo-50/40' : (isSafety ? 'hover:bg-red-50/40' : (isAgency ? 'hover:bg-amber-50/40' : 'hover:bg-slate-50/80')));

        const catBadgeClass = isHQ ? 'bg-blue-100 text-blue-800 border-blue-200' : (isSports ? 'bg-indigo-100 text-indigo-800 border-indigo-200' : (isSafety ? 'bg-red-100 text-red-800 border-red-200' : (isAgency ? 'bg-amber-100 text-amber-900 border-amber-200' : 'bg-slate-100 text-slate-700 border-slate-200')));

        const adminNo = formatAutoHyphen((duty.adminPhone || (!duty.phone?.startsWith('010') ? duty.phone : '') || '').trim());
        const mobileNo = formatAutoHyphen((duty.mobilePhone || (duty.phone?.startsWith('010') ? duty.phone : '') || '').trim());

        let phoneHtml = '';
        if (adminNo) {
          phoneHtml += '<div>' +
            '<a href="tel:' + adminNo.replace(/[^0-9]/g, '') + '" class="inline-flex items-center gap-1 text-xs font-bold text-blue-900 bg-blue-50 hover:bg-blue-100 px-2 py-0.5 rounded border border-blue-200 shadow-3xs transition-all active:scale-95 cursor-pointer" title="행정전화 걸기: ' + adminNo + '">' +
              '<span class="text-[10.5px] font-extrabold text-blue-800">📞 행정:</span>' +
              '<span class="font-mono">' + adminNo + '</span>' +
            '</a>' +
          '</div>';
        }
        if (showPrivateMobile && mobileNo) {
          phoneHtml += '<div>' +
            '<a href="tel:' + mobileNo.replace(/[^0-9]/g, '') + '" class="inline-flex items-center gap-1 text-xs font-bold text-emerald-900 bg-emerald-50 hover:bg-emerald-100 px-2 py-0.5 rounded border border-emerald-200 shadow-3xs transition-all active:scale-95 cursor-pointer" title="휴대전화 걸기: ' + mobileNo + '">' +
              '<span class="text-[10.5px] font-extrabold text-emerald-800">📱 폰:</span>' +
              '<span class="font-mono">' + mobileNo + '</span>' +
            '</a>' +
          '</div>';
        }

        const tasksHtml = (duty.tasks && duty.tasks.length > 0)
          ? '<ul class="space-y-1">' +
              duty.tasks.map(t => '<li class="flex items-start gap-1.5 text-xs text-slate-800 font-medium leading-relaxed break-keep"><span class="text-slate-400 font-bold shrink-0 text-xs select-none">•</span><span>' + t + '</span></li>').join('') +
            '</ul>'
          : '<span class="text-slate-400 italic font-normal text-xs">(과업 세부 내역 작성 대기)</span>';

        const deptDisplay = duty.deptOrOrg
          ? '<div class="font-extrabold text-xs text-slate-900 leading-snug">' + duty.deptOrOrg + '</div>'
          : '<div class="text-slate-400 italic font-normal text-xs leading-snug">(부서·기관 미지정)</div>';

        const roleDisplay = duty.role
          ? '<div class="text-xs font-bold text-slate-800 leading-snug">' + duty.role + '</div>'
          : '<div class="text-slate-400 italic font-normal text-xs leading-snug">(담당 역할 설정 대기)</div>';

        const contactDisplay = (duty.manager || phoneHtml)
          ? '<div class="space-y-1">' +
              (duty.manager ? '<div class="inline-flex items-center gap-1 text-xs font-bold text-slate-800 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">👤 ' + (showPrivateMobile ? duty.manager : maskPersonName(duty.manager)) + '</div>' : '') +
              phoneHtml +
            '</div>'
          : '<span class="text-slate-400 text-xs font-medium">-</span>';

        return '<tr class="transition-colors align-top ' + rowHover + '">' +
          '<td class="py-3 px-3 text-center whitespace-nowrap">' +
            '<span class="text-[11px] font-extrabold px-2 py-0.5 rounded border ' + catBadgeClass + '">' + duty.category + '</span>' +
          '</td>' +
          '<td class="py-3 px-3">' + deptDisplay + '</td>' +
          '<td class="py-3 px-3">' + roleDisplay + '</td>' +
          '<td class="py-3 px-3 whitespace-nowrap">' + contactDisplay + '</td>' +
          '<td class="py-3 px-3">' + tasksHtml + '</td>' +
        '</tr>';
      }).join('');

      container.innerHTML = '<div class="overflow-x-auto">' +
        '<table class="w-full text-left border-collapse min-w-[780px]">' +
          '<thead>' +
            '<tr class="bg-slate-100 border-b border-slate-300 text-slate-700 text-xs font-extrabold">' +
              '<th class="py-2.5 px-3 text-center w-24 shrink-0">구분</th>' +
              '<th class="py-2.5 px-3 text-left w-44 shrink-0">부서·기관명</th>' +
              '<th class="py-2.5 px-3 text-left w-48 shrink-0">담당 역할</th>' +
              '<th class="py-2.5 px-3 text-left w-48 shrink-0">담당자 / 연락처</th>' +
              '<th class="py-2.5 px-3 text-left">배정 과업</th>' +
            '</tr>' +
          '</thead>' +
          '<tbody class="divide-y divide-slate-200">' + rowsHtml + '</tbody>' +
        '</table>' +
      '</div>';
    }

    window.selectDutyCategory = function(cat) {
      activeDutyCategory = cat;
      renderDuties();
    };

    function setActiveTab(tab) {
      activeTab = tab;

      const tabs = ['milestones', 'booths', 'schedule', 'duties'];
      tabs.forEach(t => {
        const btn = document.getElementById('tab-' + t);
        const content = document.getElementById('content-' + t);
        if (t === tab) {
          if (btn) btn.className = 'py-2.5 text-xs font-extrabold rounded-lg transition-all cursor-pointer text-center bg-slate-900 text-white shadow-xs';
          if (content) content.classList.remove('hidden');
        } else {
          if (btn) btn.className = 'py-2.5 text-xs font-bold rounded-lg transition-all cursor-pointer text-center text-slate-700 hover:bg-slate-300/70';
          if (content) content.classList.add('hidden');
        }
      });

      if (tab === 'milestones') renderMilestones();
      else if (tab === 'booths') renderBooths();
      else if (tab === 'schedule') renderSchedule();
      else if (tab === 'duties') renderDuties();
    }

    document.getElementById('tab-milestones').onclick = function() { setActiveTab('milestones'); };
    document.getElementById('tab-booths').onclick = function() { setActiveTab('booths'); };
    document.getElementById('tab-schedule').onclick = function() { setActiveTab('schedule'); };
    document.getElementById('tab-duties').onclick = function() { setActiveTab('duties'); };

    document.getElementById('btn-toggle-all-tasks').onclick = function() {
      const allIds = (appData.milestones || []).filter(m => m.id !== 2).map(m => m.id);
      if (expandedTasks.size === allIds.length) {
        expandedTasks.clear();
        document.getElementById('toggle-all-icon').innerText = '▼';
        document.getElementById('toggle-all-text').innerText = '전체 펼치기';
      } else {
        allIds.forEach(id => expandedTasks.add(id));
        document.getElementById('toggle-all-icon').innerText = '▲';
        document.getElementById('toggle-all-text').innerText = '전체 접기';
      }
      renderMilestones();
    };

    document.getElementById('btn-toggle-font').onclick = function() {
      isLargeFont = !isLargeFont;
      document.getElementById('app-root').classList.toggle('is-large-font', isLargeFont);
      this.classList.toggle('bg-amber-400', isLargeFont);
      this.classList.toggle('text-slate-950', isLargeFont);
      this.classList.toggle('border-amber-300', isLargeFont);
      document.getElementById('font-icon').innerText = isLargeFont ? '가-' : '가+';
      document.getElementById('font-label').innerText = isLargeFont ? '보통' : '큰글씨';
    };

    document.getElementById('btn-share').onclick = function() {
      const title = appData.meta?.title || '제8회 강남구청장배 걷기 대회 연계 2026 양재천 걷자! 건강 페스티벌';
      const targetUrl = window.location.origin + '/festival/yangjae';

      let copied = false;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(targetUrl).then(() => { copied = true; }).catch(() => {});
      }
      if (!copied) {
        const ta = document.createElement('textarea');
        ta.value = targetUrl;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(ta);
      }

      if (navigator.share) {
        try {
          navigator.share({ title: title, text: targetUrl, url: targetUrl });
        } catch(e) {}
      }

      const t = document.getElementById('toast');
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3000);
    };

    // Schedule & Duties Search Listeners
    const schedInput = document.getElementById('input-schedule-search');
    const schedClear = document.getElementById('btn-clear-schedule-search');
    if (schedInput) {
      schedInput.addEventListener('input', function(e) {
        scheduleSearchQuery = e.target.value;
        if (schedClear) schedClear.classList.toggle('hidden', !scheduleSearchQuery);
        renderSchedule();
      });
    }
    if (schedClear) {
      schedClear.addEventListener('click', function() {
        scheduleSearchQuery = '';
        if (schedInput) schedInput.value = '';
        schedClear.classList.add('hidden');
        renderSchedule();
      });
    }

    const dutyInput = document.getElementById('input-duty-search');
    const dutyClear = document.getElementById('btn-clear-duty-search');
    if (dutyInput) {
      dutyInput.addEventListener('input', function(e) {
        dutySearchQuery = e.target.value;
        if (dutyClear) dutyClear.classList.toggle('hidden', !dutySearchQuery);
        renderDuties();
      });
    }
    if (dutyClear) {
      dutyClear.addEventListener('click', function() {
        dutySearchQuery = '';
        if (dutyInput) dutyInput.value = '';
        dutyClear.classList.add('hidden');
        renderDuties();
      });
    }

    async function pollLatestData() {
      try {
        const res = await fetch('/api/festival/yangjae?t=' + Date.now());
        if (res.ok) {
          const fresh = await res.json();
          if (fresh && fresh.booths && fresh.booths.length > 0) {
            // Guard: If response is a fallback and current appData is newer, do not overwrite!
            const currentUpdated = appData.meta?.lastUpdated || '';
            const freshUpdated = fresh.meta?.lastUpdated || '';
            if (fresh._source === 'fallback' && currentUpdated > freshUpdated) {
              return;
            }

            if (JSON.stringify(fresh) !== JSON.stringify(appData)) {
              appData = fresh;
              renderOverview();
              if (activeTab === 'milestones') renderMilestones();
              else if (activeTab === 'booths') renderBooths();
              else if (activeTab === 'schedule') renderSchedule();
              else if (activeTab === 'duties') renderDuties();
            }
          }
        }
      } catch (e) {}
    }
    setInterval(pollLatestData, 3000);

    // Initial render
    updateMobileToggleButtons();
    renderOverview();
    renderMilestones();
    renderBooths();
    renderSchedule();
    renderDuties();
  </script>
</body>
</html>
