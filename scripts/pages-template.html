    function parseDetail(raw) {
      if (!raw) return { date: '', status: 'todo', attendees: '', text: '' };
      const m = raw.match(/^\[(완료|진행|예정)\](?:\[(?!참여:)([^\]]*)\])?(?:\[참여:([^\]]*)\])?(?:\s*([\s\S]*)|$)/);
      if (m) {
        return {
          status: m[1] === '완료' ? 'done' : m[1] === '진행' ? 'in-progress' : 'todo',
          date: m[2] || '',
          attendees: m[3] || '',
          text: m[4] !== undefined ? m[4] : ''
        };
      }
      return { date: '', status: 'todo', attendees: '', text: raw };
    }

    function renderBulletedContent(text) {
      if (!text) return '';
      const rawLines = text.split('\n').map(l => l.trim()).filter(Boolean);
      if (rawLines.length > 1) {
        return '<div class="space-y-1">' +
          rawLines.map((line, idx) => {
            const cleanLine = line.replace(/^[-•*·]\s*/, '');
            const isHeading = idx === 0 && !line.startsWith('-') && !line.startsWith('•') && !line.startsWith('*');
            return '<div class="flex items-start gap-1.5">' +
              '<span class="text-slate-400 font-bold shrink-0 text-xs select-none mt-0.5">' + (isHeading ? '▪' : '-') + '</span>' +
              '<span class="' + (isHeading ? 'font-bold text-slate-900' : 'font-medium text-slate-800') + ' leading-relaxed break-keep">' + cleanLine + '</span>' +
            '</div>';
          }).join('') +
        '</div>';
      }

      if (text.includes(':')) {
        const colonIdx = text.indexOf(':');
        const titlePart = text.substring(0, colonIdx).trim();
        const bodyPart = text.substring(colonIdx + 1).trim();
        return '<div class="space-y-1">' +
          (titlePart ? '<div class="font-extrabold text-slate-900 text-[13px] sm:text-[13.5px] tracking-tight leading-snug break-keep flex items-center gap-1.5"><span>' + titlePart + '</span></div>' : '') +
          (bodyPart ? '<div class="mt-1 pl-2.5 border-l-2 border-slate-300/90 py-0.5"><span class="text-slate-700 font-medium text-xs leading-relaxed break-keep">' + bodyPart + '</span></div>' : '') +
        '</div>';
      }

      return '<span class="font-bold text-slate-900 text-[13px] sm:text-[13.5px] leading-relaxed break-keep">' + text + '</span>';
    }

    function calculateDDay() {
      const targetTime = new Date("2026-10-31T09:00:00").getTime();
      const now = Date.now();
      const diff = targetTime - now;
      return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
    }

    function renderMilestones() {

        const card = document.createElement('div');
        card.className = 'p-3.5 rounded-xl border-2 transition-all shadow-2xs ' +

            ? 'bg-amber-50/70 border-amber-400 ring-1 ring-amber-300'
            : m.status === 'done'
            ? 'bg-white border-slate-300'
            : 'bg-white border-slate-200 text-slate-600');

        let detailsHtml = '';
        if (isExpanded) {
          let coopHtml = '';
          if (m.cooperationDepts && m.cooperationDepts.length > 0) {
            coopHtml = '<div class="flex items-center flex-wrap gap-1.5 pb-2">' +
              '<span class="text-[11px] font-bold text-slate-500">협조부서:</span>' +
              m.cooperationDepts.map(d =>
                '<span class="text-[10px] px-1.5 py-0.5 font-bold bg-indigo-50 text-indigo-800 border border-indigo-200 rounded-md">' + d + '</span>'
              ).join('') +
            '</div>';
          }

          let itemsHtml = '';
          if (m.details && m.details.length > 0) {
            itemsHtml = '<div class="bg-slate-50 rounded-xl border border-slate-200 overflow-hidden divide-y divide-slate-200/90 shadow-2xs">' +
              m.details.map(detail => {
                const parsed = parseDetail(detail);
                const isCoopTask = parsed.text.includes('[협조') || detail.includes('[협조');
                
                let attendeesHtml = '';
                if (parsed.attendees) {
                  attendeesHtml = '<div class="flex items-center gap-1.5 flex-wrap pt-1.5 border-t border-slate-200/70 mt-1.5">' +
                    parsed.attendees.split(',').map(person => {
                      const clean = person.trim();
                      if (!clean) return '';
                      let staff = STAFF_PHONE_MAP[clean];
                      if (!staff) {
                        if (clean.includes('형종')) staff = STAFF_PHONE_MAP['김형종'];
                        else if (clean.includes('한국신체정보') || clean.includes('한국신체')) staff = STAFF_PHONE_MAP['한국신체정보'];
                        else if (clean.includes('김지현') || clean.includes('지현')) staff = STAFF_PHONE_MAP['김지현'];
                        else if (clean.includes('서울대병원') || clean.includes('서울대학교병원')) staff = STAFF_PHONE_MAP['서울대병원 강남센터'];
                        else if (clean.includes('유디')) staff = STAFF_PHONE_MAP['(주)유디'];
                        else if (clean.includes('강남차병원') || clean.includes('차병원')) staff = STAFF_PHONE_MAP['강남차병원'];
                        else if (clean.includes('희선')) staff = STAFF_PHONE_MAP['희선팀장님'];
                        else if (clean.includes('지영')) staff = STAFF_PHONE_MAP['지영팀장님'];
                        else if (clean.includes('제이민') || clean.includes('김다희') || clean.includes('다희')) staff = STAFF_PHONE_MAP['제이민'];
                        else if (clean.includes('과장')) staff = STAFF_PHONE_MAP['과장님'];
                      }
                      if (staff) {
                        return '<a href="tel:' + staff.tel + '" class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10.5px] font-bold bg-amber-50 hover:bg-amber-100 text-amber-950 border border-amber-300/80 shadow-3xs transition-all cursor-pointer active:scale-95" title="전화 연결: ' + staff.tel + '">' +
                          '<svg class="w-2.5 h-2.5 text-amber-700 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>' +
                          '<span>' + clean + '</span>' +
                          '<span class="text-amber-900 font-mono text-[9px] bg-amber-200/90 px-1.5 py-0.2 rounded-full font-black">' + staff.ext + '</span>' +
                        '</a>';
                      }
                      return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10.5px] font-bold bg-slate-100 text-slate-700 border border-slate-200/80 shadow-3xs"><svg class="w-2.5 h-2.5 text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg><span>' + clean + '</span></span>';
                    }).join('') +
                  '</div>';
                }

                const displayDate = parsed.date ? parsed.date.replace(/\.$/, '') : '상시';
                const isTimeRange = displayDate.indexOf('~') !== -1;
                const isShortDate = displayDate.length <= 5 && !isTimeRange;
                const statusColor = parsed.status === 'done'
                  ? 'bg-emerald-600 text-white'
                  : parsed.status === 'in-progress'
                  ? 'bg-amber-500 text-white'
                  : 'bg-slate-600 text-white';
                const statusLabel = parsed.status === 'done' ? '✓ 완료' : parsed.status === 'in-progress' ? '▶ 진행' : '○ 예정';
                const borderClass = parsed.status === 'done'
                  ? 'border-emerald-500'
                  : parsed.status === 'in-progress'
                  ? 'border-amber-500'
                  : 'border-slate-400';
                const dateFontClass = isTimeRange ? 'text-[10.5px] sm:text-[11px]' : (isShortDate ? 'text-[14.5px] sm:text-[15px]' : 'text-[13px] sm:text-[13.5px]');

                return '<div class="p-3 flex items-start gap-3 transition-colors ' + (isCoopTask ? 'bg-indigo-50/40 hover:bg-indigo-50/70' : 'hover:bg-white bg-white/70') + '">' +
                  '<div class="date-tile shrink-0 flex flex-col items-center justify-center rounded-xl border-2 overflow-hidden shadow-xs font-mono min-w-[70px] sm:min-w-[76px] text-center mt-0.5 bg-white transition-all ' + borderClass + '">' +
                    '<span class="date-text w-full bg-slate-50 text-slate-950 font-black px-1 py-1.5 tracking-tight border-b border-slate-200 break-all leading-snug ' + dateFontClass + '">' + displayDate + '</span>' +
                    '<span class="status-text w-full px-1 py-1 text-[11px] sm:text-[11.5px] font-black tracking-normal ' + statusColor + '">' + statusLabel + '</span>' +
                  '</div>' +
                  '<div class="flex-1 min-w-0 pt-0.5 space-y-1.5">' +
                    '<div class="' + (parsed.status === 'done' ? 'text-slate-800' : 'text-slate-950 font-medium') + '">' +
                      renderBulletedContent(parsed.text) +
                    '</div>' +
                    attendeesHtml +
                  '</div>' +
                '</div>';
              }).join('') +
            '</div>';
          }

          detailsHtml = '<div class="pt-2 space-y-2">' + coopHtml + itemsHtml + '</div>';
        }

        const statusBadge = m.status === 'done'
          ? '<span class="text-[11px] px-2 py-0.5 font-bold rounded border bg-slate-100 text-slate-700 border-slate-300 font-extrabold">✓ 완료</span>'
          : m.status === 'in-progress'
          ? '<span class="text-[11px] px-2 py-0.5 font-bold rounded border bg-amber-100 text-amber-900 border-amber-400 font-black">▶ 진행중</span>'
          : '<span class="text-[11px] px-2 py-0.5 font-bold rounded border bg-slate-50 text-slate-400 border-slate-200">○ 예정</span>';

        card.innerHTML =
          '<div class="flex items-center justify-between pb-2 mb-1 border-b border-slate-200 gap-1.5 cursor-pointer" onclick="toggleTask(' + m.id + ')">' +
            '<div class="flex items-center gap-2 flex-1 min-w-0">' +
              '<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 text-white shadow-2xs max-w-full">' +
                '<span class="font-black text-amber-300 text-[11px] shrink-0">' + m.number + '</span>' +
                '<span class="w-[1px] h-3 bg-slate-600 shrink-0"></span>' +
                '<span class="text-xs font-extrabold text-slate-50 tracking-tight truncate">' + m.title + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="flex items-center gap-1.5 shrink-0">' +
              statusBadge +
              '<span class="text-xs font-bold text-slate-500">' + (isExpanded ? '▲' : '▼') + '</span>' +
            '</div>' +
          '</div>' +
          detailsHtml;

        container.appendChild(card);
      });
    }

    function parseBoothScale(scale) {
      if (!scale || typeof scale !== 'string') return { dong: 0, bus: 0 };
      const dongMatch = scale.match(/(\d+)\s*동/);
      let dong = 0;
      if (dongMatch) {
        dong = parseInt(dongMatch[1], 10);
      } else {
        const numOnly = scale.match(/^(\d+)$/);
        if (numOnly) dong = parseInt(numOnly[1], 10);
      }
      const busMatch = scale.match(/(?:검진)?버스\s*(\d+)\s*대|(\d+)\s*대\s*(?:검진)?버스|(?:검진)?버스/);
      let bus = 0;
      if (busMatch) {
        const num = busMatch[1] || busMatch[2];
        bus = num ? parseInt(num, 10) : 1;
      }
      return { dong: dong, bus: bus };
    }

    function renderBooths() {
      const container = document.getElementById('booths-list');
      const pillsContainer = document.getElementById('booth-filter-pills');
      if (!container || !pillsContainer) return;

      const categories = ['전체', '민간', '보건소 부서'];
      pillsContainer.innerHTML = categories.map(cat =>
        '<button type="button" onclick="selectCategory(\'' + cat + '\')" class="px-2.5 py-1 text-xs rounded-lg font-bold whitespace-nowrap border cursor-pointer ' +
        (activeCategory === cat ? 'bg-slate-900 text-white border-slate-900 shadow-xs' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100') + '">' +
        cat +
        '</button>'
      ).join('');

      const allBooths = appData.booths || [];
      let confirmedEntities = 0;
      let pendingEntities = 0;
      let totalDong = 0;
      let confirmedDong = 0;
      let pendingDong = 0;
      let totalBus = 0;

      for (let i = 0; i < allBooths.length; i++) {
        const b = allBooths[i];
        if (!b) continue;
        const isConfirmed = b.status === '확정';
        if (isConfirmed) confirmedEntities++;
        else pendingEntities++;

        const parsed = parseBoothScale(b.scale);
        totalDong += parsed.dong;
        totalBus += parsed.bus;
        if (isConfirmed) confirmedDong += parsed.dong;
        else pendingDong += parsed.dong;
      }

      const summaryContainer = document.getElementById('booth-summary-banner');
      if (summaryContainer) {
        summaryContainer.innerHTML = 
          '<div class="bg-gradient-to-br from-slate-900 via-slate-850 to-slate-950 text-white rounded-xl shadow-xs border border-slate-700 p-3 sm:p-3.5">' +
            '<div class="grid grid-cols-2 divide-x divide-slate-800 gap-x-3 sm:gap-x-4">' +
              '<div class="flex flex-col justify-between pr-1">' +
                '<div class="flex items-center gap-1.5 sm:gap-2 mb-1.5">' +
                  '<div class="w-6 h-6 rounded-md bg-indigo-500/20 border border-indigo-400/30 flex items-center justify-center shrink-0">' +
                    '<svg class="w-3.5 h-3.5 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>' +
                  '</div>' +
                  '<span class="text-[11px] sm:text-xs font-bold text-slate-300 whitespace-nowrap">총 부스 참여 주체</span>' +
                '</div>' +
                '<div class="py-0.5">' +
                  '<div class="text-xl sm:text-2xl font-black text-white tracking-tight whitespace-nowrap">총 ' + allBooths.length + '개 기관</div>' +
                '</div>' +
                '<div class="mt-2 pt-2 border-t border-slate-800/90 flex items-center gap-1 sm:gap-1.5 flex-wrap">' +
                  '<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] sm:text-[11px] font-extrabold bg-indigo-950/80 text-indigo-300 border border-indigo-700/60 whitespace-nowrap">확정 ' + confirmedEntities + '</span>' +
                  '<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] sm:text-[11px] font-bold bg-slate-800/90 text-slate-300 border border-slate-700 whitespace-nowrap">협의 ' + pendingEntities + '</span>' +
                '</div>' +
              '</div>' +
              '<div class="flex flex-col justify-between pl-3 sm:pl-4">' +
                '<div class="flex items-center gap-1.5 sm:gap-2 mb-1.5">' +
                  '<div class="w-6 h-6 rounded-md bg-emerald-500/20 border border-emerald-400/30 flex items-center justify-center shrink-0">' +
                    '<svg class="w-3.5 h-3.5 text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V9l-7-6-7 6v12M9 21v-7h6v7" /></svg>' +
                  '</div>' +
                  '<span class="text-[11px] sm:text-xs font-bold text-slate-300 whitespace-nowrap">총 필요 부스 규모</span>' +
                '</div>' +
                '<div class="py-0.5">' +
                  '<div class="text-xl sm:text-2xl font-black text-emerald-400 tracking-tight whitespace-nowrap">총 ' + totalDong + '동</div>' +
                '</div>' +
                '<div class="mt-2 pt-2 border-t border-slate-800/90 flex items-center gap-1 sm:gap-1.5 flex-wrap">' +
                  '<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] sm:text-[11px] font-extrabold bg-emerald-950/80 text-emerald-300 border border-emerald-700/60 whitespace-nowrap">확정 ' + confirmedDong + '동</span>' +
                  (pendingDong > 0 ? '<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] sm:text-[11px] font-bold bg-amber-950/70 text-amber-300 border border-amber-700/60 whitespace-nowrap">협의 ' + pendingDong + '동</span>' : '') +
                  (totalBus > 0 ? '<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] sm:text-[11px] font-bold bg-sky-950/80 text-sky-300 border border-sky-700/60 whitespace-nowrap">버스 ' + totalBus + '대</span>' : '') +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
      }

      document.getElementById('booth-count-badge').innerHTML = 
        '<span>확정 <strong class="font-black text-slate-900">' + confirmedEntities + '</strong> / 총 <strong class="font-black text-slate-900">' + allBooths.length + '개</strong></span>' +
        '<span class="text-slate-400 mx-0.5">·</span>' +
        '<span class="font-black text-emerald-800 bg-emerald-100/80 px-1.5 py-0.5 rounded text-[10px] sm:text-[11px] border border-emerald-300/60">필요 ' + totalDong + '동</span>';

      const booths = (appData.booths || []).filter(b => {
        if (activeCategory === '전체') return true;
        if (activeCategory === '보건소 부서' || activeCategory === '보건소 사업' || activeCategory === '보건소 특화') {
          return b.category === '보건소 부서' || b.category === '보건소 사업' || b.category === '보건소 특화';
        }
        if (activeCategory === '민간' || activeCategory === '민간 헬스케어' || activeCategory === '전문 의료·검진' || activeCategory === '의료·검진' || activeCategory === '의료 검진') {
          return b.category === '민간' || b.category === '민간 헬스케어' || b.category === '전문 의료·검진' || b.category === '의료·검진' || b.category === '의료 검진';
        }
        return b.category === activeCategory;
      });

      container.innerHTML = booths.map((b, idx) =>
        '<div class="p-3.5 bg-white border-2 border-slate-300 rounded-xl shadow-2xs">' +
          '<div class="flex items-center justify-between pb-1.5 mb-1.5 border-b border-slate-200">' +
            '<div class="flex items-center gap-1.5">' +
              '<span class="text-[11px] font-mono font-black text-slate-700">No.' + (idx + 1) + '</span>' +
              '<span class="text-[11px] font-bold text-slate-800 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-300">' + b.category + '</span>' +
            '</div>' +
            '<span class="text-[11px] px-2 py-0.5 font-bold rounded border ' + (b.status === '확정' ? 'bg-emerald-50 text-emerald-800 border-emerald-300' : 'bg-amber-50 text-amber-800 border-amber-300') + '">' + b.status + '</span>' +
          '</div>' +
          '<div class="text-sm font-extrabold text-slate-900 mb-1.5">' + b.name + '</div>' +
          '<div class="text-xs text-slate-700 bg-slate-50 p-2.5 rounded border border-slate-200 leading-relaxed mb-1.5">' +
            '<span class="font-bold text-slate-600">내용: </span>' + b.program +
          '</div>' +
          '<div class="text-xs text-slate-600 font-medium">부스규모: <strong class="text-slate-900">' + b.scale + '</strong></div>' +
        '</div>'
      ).join('');
    }

    window.toggleTask = function(id) {
      if (expandedTasks.has(id)) expandedTasks.delete(id);
      else expandedTasks.add(id);
      renderMilestones();
    };

    window.selectCategory = function(cat) {
      activeCategory = cat;
      renderBooths();
    };

    document.getElementById('tab-milestones').onclick = function() {
      activeTab = 'milestones';
      this.className = 'py-2.5 text-xs font-extrabold rounded-lg transition-all cursor-pointer text-center bg-slate-900 text-white shadow-xs';
      document.getElementById('tab-booths').className = 'py-2.5 text-xs font-bold rounded-lg transition-all cursor-pointer text-center text-slate-700 hover:bg-slate-300/70';
      document.getElementById('content-milestones').classList.remove('hidden');
      document.getElementById('content-booths').classList.add('hidden');
      renderMilestones();
    };

    document.getElementById('tab-booths').onclick = function() {
      activeTab = 'booths';
      this.className = 'py-2.5 text-xs font-extrabold rounded-lg transition-all cursor-pointer text-center bg-slate-900 text-white shadow-xs';
      document.getElementById('tab-milestones').className = 'py-2.5 text-xs font-bold rounded-lg transition-all cursor-pointer text-center text-slate-700 hover:bg-slate-300/70';
      document.getElementById('content-booths').classList.remove('hidden');
      document.getElementById('content-milestones').classList.add('hidden');
      renderBooths();
    };

    document.getElementById('btn-toggle-all-tasks').onclick = function() {
      const allIds = (appData.milestones || []).map(m => m.id);
      if (expandedTasks.size === allIds.length) {
        expandedTasks.clear();
        document.getElementById('toggle-all-icon').innerText = '▼';
        document.getElementById('toggle-all-text').innerText = '전체 펼치기';
      } else {
        allIds.forEach(id => expandedTasks.add(id));
        document.getElementById('toggle-all-icon').innerText = '▲';
        document.getElementById('toggle-all-text').innerText = '전체 접기';
      }
      renderMilestones();
    };

    document.getElementById('btn-toggle-font').onclick = function() {
      isLargeFont = !isLargeFont;
      document.getElementById('app-root').classList.toggle('is-large-font', isLargeFont);
      this.classList.toggle('bg-amber-400', isLargeFont);
      this.classList.toggle('text-slate-950', isLargeFont);
      this.classList.toggle('border-amber-300', isLargeFont);
      document.getElementById('font-icon').innerText = isLargeFont ? '가-' : '가+';
      document.getElementById('font-label').innerText = isLargeFont ? '보통' : '큰글씨';
    };

    document.getElementById('btn-share').onclick = function() {
      const title = appData.meta?.title || '2026 양재천 걷자! 건강 페스티벌';
      const period = appData.weeklyReport?.period || '9. 7. ~ 9. 11.';
      const weekTitle = appData.weeklyReport?.weekTitle || '주간 추진실적 보고';
      const staffNote = appData.meta?.staffNote || '행사 참여 직원 대체휴무 시행 예정';
      const report = (appData.weeklyReport?.items || []).join('\n');
      const targetUrl = window.location.origin + '/festival/yangjae';

      const text = '[' + title + ' | ' + weekTitle + ']\n' +
        '(추진기간: ' + period + ')\n\n' +
        '**' + staffNote + '**\n\n' +
        '■ 추진내역\n' + report + '\n\n' +
        '※ 아래 링크 클릭하시면 전체 추진내역 열람이 가능합니다.\n' + targetUrl;

      let copied = false;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => { copied = true; }).catch(() => {});
      }
      if (!copied) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(ta);
      }

      if (navigator.share) {
        try {
          navigator.share({ title: '[' + title + ' | ' + weekTitle + ']', text: text });
        } catch(e) {}
      }

      const t = document.getElementById('toast');
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3000);
    };

    async function pollLatestData() {
      try {
        const res = await fetch('/api/festival/yangjae?t=' + Date.now());
        if (res.ok) {
          const fresh = await res.json();
          if (fresh && fresh.booths && fresh.booths.length > 0) {
            // Guard: If response is a fallback and current appData is newer, do not overwrite!
            const currentUpdated = appData.meta?.lastUpdated || '';
            const freshUpdated = fresh.meta?.lastUpdated || '';
            if (fresh._source === 'fallback' && currentUpdated > freshUpdated) {
              return;
            }

            if (JSON.stringify(fresh) !== JSON.stringify(appData)) {
              appData = fresh;
              renderOverview();
              if (activeTab === 'milestones') renderMilestones();
              else renderBooths();
            }
          }
        }
      } catch (e) {}
    }
    setInterval(pollLatestData, 3000);

    // Initial render
    renderOverview();
    renderMilestones();
    renderBooths();
  </script>
</body>
</html>
